<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qujott — Quiet Jotter</title>
  <meta name="description" content="Qujott combines the simplicity and readability of a notepad with the freedom and versatility of a text editor. Standard Markdown notes with zero proprietary lock-in.">
  <link rel="canonical" href="https://qujott.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://qujott.com/en/">
  <link rel="alternate" hreflang="ja" href="https://qujott.com/ja/">
  <link rel="alternate" hreflang="en" href="https://qujott.com/en/">
  <link rel="alternate" hreflang="es" href="https://qujott.com/es/">
  <link rel="alternate" hreflang="pt-BR" href="https://qujott.com/pt-br/">
  <link rel="alternate" hreflang="de" href="https://qujott.com/de/">
  <link rel="alternate" hreflang="fr" href="https://qujott.com/fr/">
  <link rel="alternate" hreflang="ko" href="https://qujott.com/ko/">
  <link rel="alternate" hreflang="zh-TW" href="https://qujott.com/zh-tw/">
  <noscript>
    <meta http-equiv="refresh" content="0; url=en/">
  </noscript>
  <script>
    (function() {
      var supported = ['ja', 'en', 'es', 'pt-br', 'de', 'fr', 'ko', 'zh-tw'];
      var saved = null;
      try {
        saved = localStorage.getItem('qujott-lang');
      } catch (e) {}

      var targetLang = null;
      if (saved && supported.indexOf(saved) !== -1) {
        targetLang = saved;
      } else {
        var userLangs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
        for (var i = 0; i < userLangs.length; i++) {
          var code = (userLangs[i] || '').toLowerCase();
          if (code.startsWith('ja')) { targetLang = 'ja'; break; }
          if (code.startsWith('zh-tw') || code.startsWith('zh-hk') || code.startsWith('zh-mo') || code.startsWith('zh-hant')) { targetLang = 'zh-tw'; break; }
          if (code.startsWith('ko')) { targetLang = 'ko'; break; }
          if (code.startsWith('es')) { targetLang = 'es'; break; }
          if (code.startsWith('pt')) { targetLang = 'pt-br'; break; }
          if (code.startsWith('de')) { targetLang = 'de'; break; }
          if (code.startsWith('fr')) { targetLang = 'fr'; break; }
          if (code.startsWith('en')) { targetLang = 'en'; break; }
        }
      }
      if (!targetLang) {
        targetLang = 'en';
      }
      window.location.replace(targetLang + '/');
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 48px 24px; text-align: center; color: #1d1d1f; background: #fafafa;">
  <noscript>
    <h1 style="font-size: 24px; margin-bottom: 12px; font-weight: 600;">Qujott — Quiet Jotter</h1>
    <p style="font-size: 16px; margin-bottom: 24px; color: #555;">Redirecting to Qujott in English...</p>
    <p><a href="en/" style="display: inline-block; padding: 10px 20px; background: #1d1d1f; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 500;">Continue to English</a></p>
    <p style="margin-top: 36px; font-size: 13px; color: #888; line-height: 2;">
      Languages:
      <a href="ja/" style="color: #444; margin: 0 4px;">日本語</a> •
      <a href="en/" style="color: #444; margin: 0 4px;">English</a> •
      <a href="es/" style="color: #444; margin: 0 4px;">Español</a> •
      <a href="pt-br/" style="color: #444; margin: 0 4px;">Português (Brasil)</a> •
      <a href="de/" style="color: #444; margin: 0 4px;">Deutsch</a> •
      <a href="fr/" style="color: #444; margin: 0 4px;">Français</a> •
      <a href="ko/" style="color: #444; margin: 0 4px;">한국어</a> •
      <a href="zh-tw/" style="color: #444; margin: 0 4px;">繁體中文</a>
    </p>
  </noscript>
</body>
</html>
